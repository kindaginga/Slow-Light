# Builds downloadable apps on GitHub's servers every time you push.
# Results appear under the repository's Actions tab -> the latest run -> Artifacts.
name: Build apps

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - run: npm ci --no-audit --no-fund
      - run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: Slow-Light-Windows
          path: release/*.exe

  mac:
    name: Mac app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - run: npm ci --no-audit --no-fund
      - run: npx electron-builder --mac dmg --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
      - uses: actions/upload-artifact@v7
        with:
          name: Slow-Light-Mac
          path: release/*.dmg

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v4
      - run: npm ci --no-audit --no-fund
      - run: npm run www
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk "Slow-Light-Android.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: Slow-Light-Android
          path: Slow-Light-Android.apk
